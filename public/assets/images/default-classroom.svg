<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="drayaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3d38"/>
      <stop offset="50%" stop-color="#1b6d63"/>
      <stop offset="100%" stop-color="#2a9d8f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fd9a00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f4a261" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1b6d63" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#drayaGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Ambient Light -->
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Decorative Shapes -->
  <circle cx="680" cy="90" r="140" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  <circle cx="680" cy="90" r="90" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="120" cy="380" r="160" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>

  <!-- Geometric Abstract Lines -->
  <path d="M -50 350 Q 200 200 450 320 T 850 180" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3"/>
  <path d="M -50 380 Q 250 250 500 360 T 850 220" fill="none" stroke="url(#accentGrad)" stroke-width="2.5"/>

  <!-- Center Educational Icon Badge -->
  <g transform="translate(400, 200)">
    <!-- Glassmorphic Hexagon/Circle Backing -->
    <circle cx="0" cy="0" r="64" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="rgba(15, 61, 56, 0.5)"/>

    <!-- Graduation Cap / Book Icon -->
    <path d="M -28 -8 L 0 -22 L 28 -8 L 0 6 Z" fill="#ffffff"/>
    <path d="M -20 2 L -20 18 C -20 24 20 24 20 18 L 20 2 L 0 12 Z" fill="#5eead4" opacity="0.9"/>
    <path d="M 28 -8 L 34 -4 L 34 16 L 31 16 L 31 -2 Z" fill="#fd9a00"/>
    <circle cx="32.5" cy="18" r="3" fill="#fd9a00"/>
  </g>

  <!-- Draya Subtle Watermark Logo / Text in Arabic -->
  <g transform="translate(400, 305)" text-anchor="middle">
    <text font-family="'Cairo', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="22" fill="#ffffff" letter-spacing="1">منصة دراية التعليمية</text>
    <text y="24" font-family="'Cairo', 'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="13" fill="rgba(255, 255, 255, 0.75)">فصل دراسي تفاعلي</text>
  </g>
</svg>
