<!-- Sidebar: border-e (logical end border) renders on the correct side in RTL/LTR -->
<nav class="border-border bg-sidebar flex h-full flex-col border-e">
  <!-- Logo -->
  <div class="border-border border-b px-6 py-4">
    <draya-logo size="md" />
  </div>

  <!-- Nav links — ps-/pe- for logical padding -->
  <ul class="flex-1 space-y-1 p-3">
    <li>
      <a
        routerLink="/teacher/dashboard"
        routerLinkActive="bg-accent text-accent-foreground"
        class="text-muted-foreground hover:bg-accent hover:text-accent-foreground flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors">
        <span class="i-pi-th-large h-4 w-4" aria-hidden="true"></span>
        {{ 'nav.dashboard' | translate }}
      </a>
    </li>
    <li>
      <a
        routerLink="/student"
        routerLinkActive="bg-accent text-accent-foreground"
        class="text-muted-foreground hover:bg-accent hover:text-accent-foreground flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors">
        {{ 'nav.students' | translate }}
      </a>
    </li>
  </ul>

  <!-- Footer: logout + locale toggle -->
  <div class="border-border space-y-2 border-t p-4">
    <button
      (click)="localeService.toggle()"
      class="text-muted-foreground hover:bg-accent hover:text-accent-foreground w-full rounded-md px-3 py-2 text-start text-sm">
      {{ localeService.locale() === 'ar' ? 'English' : 'عربي' }}
    </button>
    <button
      (click)="auth.logout()"
      class="text-muted-foreground hover:bg-accent hover:text-accent-foreground w-full rounded-md px-3 py-2 text-start text-sm">
      {{ 'auth.logout' | translate }}
    </button>
  </div>
</nav>
