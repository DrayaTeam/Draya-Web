<div [class]="gridClass()" dir="rtl">
  @for (item of items(); track item) {
    @switch (type()) {
      @case ('exam') {
        <div class="skeleton-card exam-skeleton">
          <div class="flex items-center justify-between gap-2">
            <div class="skeleton-shimmer h-6 w-24 rounded-full"></div>
            <div class="skeleton-shimmer h-6 w-16 rounded-full"></div>
          </div>
          <div class="mt-4 space-y-2">
            <div class="skeleton-shimmer h-5 w-3/4 rounded-md"></div>
            <div class="skeleton-shimmer h-4 w-1/2 rounded-md"></div>
          </div>
          <div class="mt-6 flex items-center justify-between border-t border-slate-100 pt-4">
            <div class="flex items-center gap-2">
              <div class="skeleton-shimmer h-8 w-8 rounded-full"></div>
              <div class="skeleton-shimmer h-4 w-20 rounded-md"></div>
            </div>
            <div class="skeleton-shimmer h-4 w-16 rounded-md"></div>
          </div>
          <div class="mt-4">
            <div class="skeleton-shimmer h-10 w-full rounded-xl"></div>
          </div>
        </div>
      }

      @case ('teacher') {
        <div class="skeleton-card teacher-skeleton flex flex-col items-center text-center">
          <div class="skeleton-shimmer h-20 w-20 rounded-full"></div>
          <div class="skeleton-shimmer mt-4 h-5 w-32 rounded-md"></div>
          <div class="skeleton-shimmer mt-2 h-4 w-24 rounded-full"></div>
          <div class="mt-4 flex w-full justify-around border-y border-slate-100 py-3">
            <div class="flex flex-col items-center gap-1">
              <div class="skeleton-shimmer h-4 w-8 rounded-md"></div>
              <div class="skeleton-shimmer h-3 w-12 rounded-md"></div>
            </div>
            <div class="flex flex-col items-center gap-1">
              <div class="skeleton-shimmer h-4 w-8 rounded-md"></div>
              <div class="skeleton-shimmer h-3 w-12 rounded-md"></div>
            </div>
          </div>
          <div class="mt-5 w-full">
            <div class="skeleton-shimmer h-10 w-full rounded-xl"></div>
          </div>
        </div>
      }

      @case ('book') {
        <div class="skeleton-card book-skeleton flex flex-col">
          <div class="skeleton-shimmer h-48 w-full rounded-xl"></div>
          <div class="skeleton-shimmer mt-4 h-5 w-4/5 rounded-md"></div>
          <div class="mt-2 flex items-center gap-2">
            <div class="skeleton-shimmer h-4 w-16 rounded-md"></div>
            <div class="skeleton-shimmer h-4 w-20 rounded-md"></div>
          </div>
          <div class="mt-auto pt-4">
            <div class="skeleton-shimmer h-10 w-full rounded-xl"></div>
          </div>
        </div>
      }

      @case ('package') {
        <div class="skeleton-card package-skeleton flex flex-col">
          <div class="skeleton-shimmer h-36 w-full rounded-t-xl"></div>
          <div class="flex flex-1 flex-col p-5">
            <div class="skeleton-shimmer h-6 w-3/4 rounded-md"></div>
            <div class="skeleton-shimmer mt-2 h-4 w-1/2 rounded-md"></div>
            <div class="mt-6 space-y-2">
              <div class="flex justify-between">
                <div class="skeleton-shimmer h-4 w-16 rounded-md"></div>
                <div class="skeleton-shimmer h-4 w-12 rounded-md"></div>
              </div>
              <div class="skeleton-shimmer h-2.5 w-full rounded-full"></div>
            </div>
            <div class="mt-6 flex items-center justify-between border-t border-slate-100 pt-4">
              <div class="flex items-center gap-2">
                <div class="skeleton-shimmer h-7 w-7 rounded-full"></div>
                <div class="skeleton-shimmer h-4 w-20 rounded-md"></div>
              </div>
              <div class="skeleton-shimmer h-9 w-24 rounded-lg"></div>
            </div>
          </div>
        </div>
      }

      @case ('stat') {
        <div class="skeleton-card stat-skeleton flex items-center gap-4 p-5">
          <div class="skeleton-shimmer h-14 w-14 flex-shrink-0 rounded-2xl"></div>
          <div class="flex-1 space-y-2">
            <div class="skeleton-shimmer h-4 w-20 rounded-md"></div>
            <div class="skeleton-shimmer h-7 w-28 rounded-md"></div>
          </div>
        </div>
      }

      @default {
        <div class="skeleton-card generic-skeleton p-6">
          <div class="skeleton-shimmer mb-4 h-6 w-1/3 rounded-md"></div>
          <div class="skeleton-shimmer mb-2 h-4 w-full rounded-md"></div>
          <div class="skeleton-shimmer mb-2 h-4 w-5/6 rounded-md"></div>
          <div class="skeleton-shimmer mb-6 h-4 w-2/3 rounded-md"></div>
          <div class="skeleton-shimmer h-10 w-32 rounded-xl"></div>
        </div>
      }
    }
  }
</div>
