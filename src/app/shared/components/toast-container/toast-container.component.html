<!-- src/app/shared/components/toast-container/toast-container.component.html -->
<div class="toast-viewport" aria-live="polite" aria-atomic="true">
  @for (t of toasts(); track t.id) {
    <div
      class="toast-item animate-slide-in"
      [class.toast-success]="t.severity === 'success'"
      [class.toast-error]="t.severity === 'error'"
      [class.toast-info]="t.severity === 'info'"
      [class.toast-warn]="t.severity === 'warn'"
      role="alert">
      <!-- Icon Indicator -->
      <div class="toast-icon-wrapper">
        @if (t.severity === 'success') {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        } @else if (t.severity === 'error') {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
        } @else if (t.severity === 'warn') {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        } @else {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        }
      </div>

      <!-- Text Body -->
      <div class="toast-content">
        <strong class="toast-title">{{ t.summary }}</strong>
        @if (t.detail) {
          <p class="toast-detail">{{ t.detail }}</p>
        }
      </div>

      <!-- Dismiss Button -->
      <button
        type="button"
        class="toast-close-btn"
        (click)="onDismiss(t)"
        aria-label="إغلاق التنبيه">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  }
</div>
