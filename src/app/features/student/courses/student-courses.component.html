<div class="student-courses-root animate-fade-in">
  <!-- Ambient Background Blobs matching Figma -->
  <div class="ambient-blob blob-top-right"></div>
  <div class="ambient-blob blob-middle-left"></div>

  <!-- Top Header Content -->
  <header class="courses-page-header">
    <!-- Top Pill Badge -->
    <div class="challenge-pill-badge">
      <svg
        class="badge-icon"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#FD9A00"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <polygon
          points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
      </svg>
      <span>{{ headerInfo().badgeText }}</span>
    </div>

    <!-- Main Title & Subtitle -->
    <h1 class="page-heading">{{ headerInfo().mainHeading }}</h1>
    <p class="page-subtitle">{{ headerInfo().subtitleText }}</p>
  </header>

  <!-- Subscribed Packages Grid / Skeleton / Empty State -->
  @if (loading()) {
    <div class="mt-4">
      <draya-card-skeleton
        type="package"
        [count]="4"
        [gridClass]="'grid grid-cols-1 md:grid-cols-2 gap-6'" />
    </div>
  } @else {
    <main class="packages-cards-grid" aria-label="قائمة الباقات الدراسية">
      @if (paginatedPackages().length > 0) {
        @for (pkg of paginatedPackages(); track pkg.id) {
          <div class="card-wrapper animate-fade-in-up" [style.animation-delay]="$index * 50 + 'ms'">
            <draya-subscribed-package-card
              [package]="pkg"
              (openPackageDetails)="onOpenPackage($event)" />
          </div>
        }
      } @else {
        <div class="empty-state-wrapper animate-fade-in col-span-full w-full">
          <draya-empty-state
            icon="pi pi-book"
            titleKey="STUDENT.COURSES.EMPTY_TITLE"
            descriptionKey="STUDENT.COURSES.EMPTY_DESC"
            primaryActionLabelKey="STUDENT.COURSES.BROWSE_TEACHERS"
            primaryActionRoute="/student/teachers" />
        </div>
      }
    </main>

    <!-- Pagination Controls -->
    @if (packages().length > pageSize()) {
      <div class="animate-fade-in mt-6">
        <draya-pagination
          [totalItems]="packages().length"
          [pageSize]="pageSize()"
          [currentPage]="currentPage()"
          [pageSizeOptions]="[4, 8, 16, 20]"
          (pageChange)="currentPage.set($event)"
          (pageSizeChange)="pageSize.set($event); currentPage.set(1)" />
      </div>
    }
  }
</div>
