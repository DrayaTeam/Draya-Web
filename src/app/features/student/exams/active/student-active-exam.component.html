<div class="exam-page-container">
  <!-- Ambient Blur Blob -->
  <div class="ambient-blob"></div>

  <!-- Top Banner Info Card -->
  <header class="top-exam-banner">
    <div class="banner-right">
      <div class="banner-icon-box">
        <svg class="banner-icon" viewBox="0 0 24 24" fill="none" stroke="#0F4F49" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      </div>

      <div class="banner-text">
        <h1 class="exam-title">{{ examService.examTitle() }}</h1>
        <p class="exam-level">{{ examService.examLevelText() }}</p>
      </div>
    </div>

    <div class="timer-pill">
      <svg class="timer-icon" viewBox="0 0 24 24" fill="none" stroke="#0F4F49" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span class="timer-label">الوقت المتبقي:</span>
      <span class="timer-countdown">{{ examService.formattedTimer() }}</span>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="exam-layout-grid">
    <!-- Active Question Card (Right side in RTL) -->
    <div class="main-question-col">
      <app-exam-question-card
        [question]="examService.currentQuestion()"
        [totalQuestionsCount]="examService.totalQuestionsCount()"
        [isFirstQuestion]="examService.isFirstQuestion()"
        [isLastQuestion]="examService.isLastQuestion()"
        (selectOption)="onSelectOption($event)"
        (toggleFlag)="onToggleFlag($event)"
        (nextQuestion)="onNextQuestion()"
        (prevQuestion)="onPrevQuestion()"
        (submitExam)="onSubmitExam()"
      ></app-exam-question-card>
    </div>

    <!-- Sidebar Map & Security Warnings (Left side in RTL) -->
    <aside class="sidebar-col">
      <app-exam-question-map
        [questions]="examService.questions()"
        [currentIndex]="examService.currentQuestionIndex()"
        (selectQuestionIndex)="onGoToQuestion($event)"
      ></app-exam-question-map>

      <app-exam-security-warning></app-exam-security-warning>
    </aside>
  </main>
</div>
