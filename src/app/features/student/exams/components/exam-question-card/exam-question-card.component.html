<div class="question-card">
  <!-- Card Header Row -->
  <div class="card-header">
    <div class="header-right">
      <span class="subject-pill">{{ question().subjectTag }}</span>
      <span class="question-counter">
        السؤال
        <strong>{{ question().index }}</strong>
        من
        <strong>{{ totalQuestionsCount() }}</strong>
      </span>
    </div>

    <button
      type="button"
      class="flag-btn"
      [class.active]="question().isFlagged"
      (click)="toggleFlag.emit(question().id)">
      <svg class="flag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
      </svg>
      <span>{{ question().isFlagged ? 'مُعلّم للمراجعة' : 'تعليم السؤال' }}</span>
    </button>
  </div>

  <!-- Question Body Text -->
  <h2 class="question-text">
    {{ question().text }}
  </h2>

  <!-- Options List -->
  <div class="options-list">
    @for (opt of question().options; track opt.id) {
      <button
        type="button"
        class="option-item"
        [class.selected]="question().selectedOptionId === opt.id"
        (click)="onSelect(opt.id)">
        <span class="radio-indicator">
          @if (question().selectedOptionId === opt.id) {
            <span class="radio-inner-dot"></span>
          }
        </span>
        <span class="option-text">{{ opt.text }}</span>
      </button>
    }
  </div>

  <!-- Card Navigation Footer -->
  <div class="card-footer">
    <button
      type="button"
      class="nav-btn prev-btn"
      [disabled]="isFirstQuestion()"
      (click)="prevQuestion.emit()">
      <svg class="btn-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
      <span>السؤال السابق</span>
    </button>

    @if (isLastQuestion()) {
      <button type="button" class="nav-btn submit-btn" (click)="submitExam.emit()">
        <span>إنهاء وتسليم الامتحان</span>
      </button>
    } @else {
      <button type="button" class="nav-btn next-btn" (click)="nextQuestion.emit()">
        <span>السؤال التالي</span>
        <svg
          class="btn-arrow"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
    }
  </div>
</div>
