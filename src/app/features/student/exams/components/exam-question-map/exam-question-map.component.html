<div class="question-map-card">
  <!-- Card Header -->
  <div class="card-header">
    <svg class="map-icon" viewBox="0 0 24 24" fill="none" stroke="#FD9A00" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
    </svg>
    <h3 class="card-title">خريطة الأسئلة والإجابات</h3>
  </div>

  <!-- Question Number Buttons Grid -->
  <div class="questions-grid">
    @for (q of questions(); track q.id; let idx = $index) {
      <button
        type="button"
        class="q-num-btn"
        [class.current]="isCurrent(idx)"
        [class.answered]="!isCurrent(idx) && isAnswered(q)"
        [class.flagged]="!isCurrent(idx) && !isAnswered(q) && q.isFlagged"
        (click)="selectQuestionIndex.emit(idx)"
      >
        <span>{{ idx + 1 }}</span>
      </button>
    }
  </div>

  <!-- Legend Status Bar -->
  <div class="legend-bar">
    <div class="legend-item">
      <span class="dot dot-current"></span>
      <span class="legend-text">السؤال الحالي</span>
    </div>
    <div class="legend-item">
      <span class="dot dot-answered"></span>
      <span class="legend-text">تمت الإجابة</span>
    </div>
    <div class="legend-item">
      <span class="dot dot-flagged"></span>
      <span class="legend-text">مؤشر للمراجعة</span>
    </div>
  </div>
</div>
