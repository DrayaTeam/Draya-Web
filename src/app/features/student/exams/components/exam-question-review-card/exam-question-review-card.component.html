<div class="review-card" [class.wrong]="!reviewItem().isCorrect">
  <!-- Top Header Row -->
  <div class="card-header">
    <span class="question-number-tag">سؤال {{ reviewItem().questionIndex }}</span>
    <span
      class="status-pill"
      [class.correct]="reviewItem().isCorrect"
      [class.wrong]="!reviewItem().isCorrect"
    >
      {{ reviewItem().isCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة' }}
    </span>
  </div>

  <!-- Question Body Text -->
  <h3 class="question-body">
    {{ reviewItem().questionText }}
  </h3>

  <!-- Answers Box Row -->
  <div class="answers-grid">
    <!-- Student Answer Box -->
    <div
      class="answer-box student-box"
      [class.wrong-box]="!reviewItem().isCorrect"
      [class.correct-box]="reviewItem().isCorrect"
    >
      <span class="box-label">إجابتك:</span>
      <span class="box-val">{{ reviewItem().studentAnswerText }}</span>
    </div>

    <!-- Correct Answer Box (Only shown if student answer was wrong) -->
    @if (!reviewItem().isCorrect) {
      <div class="answer-box correct-box">
        <span class="box-label">الإجابة الصحيحة:</span>
        <span class="box-val">{{ reviewItem().correctAnswerText }}</span>
      </div>
    }
  </div>
</div>
