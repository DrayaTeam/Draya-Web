<div class="result-summary-grid">
  <div class="score-card" [class.pending-card]="report().isGradingPending">
    <span class="card-subtitle">
      {{ report().isGradingPending ? 'حالة التقييم' : 'النتيجة' }}
    </span>
    <h2
      class="score-percentage"
      [class.passed]="report().isPassed"
      [class.pending-score]="report().isGradingPending">
      {{ report().isGradingPending ? '⏳' : report().scorePercentage + '%' }}
    </h2>
    <div
      class="grade-pill"
      [class.passed]="report().isPassed"
      [class.pending-pill]="report().isGradingPending">
      <span>{{ report().gradeLabel }}</span>
    </div>
    <div class="card-footer-date">
      <span>تم تسليم الامتحان في {{ report().submittedAt }}</span>
    </div>
  </div>
</div>
