<div
  class="report-kpi-card"
  [ngClass]="{
    'variant-average': variant() === 'average',
    'variant-exams': variant() === 'exams',
    'variant-top-score': variant() === 'topScore',
  }">
  <div class="kpi-header">
    <span class="kpi-title">{{ title() }}</span>
    <div class="icon-circle">
      @if (variant() === 'average') {
        <svg
          class="kpi-icon icon-average"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385c.116.488-.415.871-.84.604l-4.71-2.98a.564.564 0 00-.586 0l-4.71 2.98c-.425.267-.956-.116-.84-.604l1.285-5.385a.563.563 0 00-.182-.557l-4.204-3.602c-.38-.325-.178-.948.32-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
        </svg>
      } @else if (variant() === 'exams') {
        <svg
          class="kpi-icon icon-exams"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      } @else {
        <svg
          class="kpi-icon icon-top-score"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.504-1.125-1.125-1.125h-6.75c-.621 0-1.125.504-1.125 1.125v3.375m9 0h3a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15A2.25 2.25 0 002.25 6.75v6.75A2.25 2.25 0 004.5 15.75h3" />
        </svg>
      }
    </div>
  </div>

  <div class="kpi-body">
    <div class="kpi-value">{{ value() }}</div>
    @if (badgeText()) {
      <span class="kpi-badge">
        <svg
          class="badge-icon"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
        </svg>
        {{ badgeText() }}
      </span>
    }
  </div>
</div>
