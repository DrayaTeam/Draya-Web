<div class="resolved-card">
  <div class="right-info">
    <div class="badge-icon">🏆</div>
    <div class="content-col">
      <div class="topic-title">{{ weakness().topicName }}</div>
      <div class="meta-row">
        <span class="subject-name">{{ weakness().subjectName || 'عام' }}</span>
        <span class="mastered-pill">أتقنتها بنجاح ✅</span>
      </div>
    </div>
  </div>

  <div class="score-col">
    <div class="score-box">{{ proficiencyPercent() }}%</div>
    <div class="delta-pill">{{ masteryMessage() }}</div>
  </div>
</div>
