<div class="weakness-card">
  <div class="color-marker" [style.background-color]="topic().barMarkerColor"></div>

  <div class="content-col">
    <div class="topic-title">{{ topic().topicTitle }}</div>
    <div class="meta-row">
      <span class="subject-name">{{ topic().subjectName }}</span>
      <span
        class="badge-pill"
        [style.background-color]="topic().badgeBgColor"
        [style.color]="topic().badgeTextColor">
        {{ topic().badgeText }}
      </span>
    </div>
  </div>

  <div class="actions-col">
    <div class="score-box" [style.color]="topic().scoreTextColor">{{ topic().scorePercent }}%</div>
    <button
      type="button"
      class="action-btn"
      [class.action-btn-reviewed]="isReviewed()"
      (click)="startReview.emit(topic())">
      @if (isReviewed()) {
        <span>عرض المراجعة المحفوظة</span>
        <svg
          class="btn-icon"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
        </svg>
      } @else {
        <span>بدء المراجعة التفاعلية</span>
        <svg
          class="btn-icon"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
      }
    </button>
  </div>
</div>
