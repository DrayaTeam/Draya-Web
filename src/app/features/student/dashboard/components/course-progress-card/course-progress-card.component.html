<article class="course-card-root">
  <!-- Right Side (RTL): Course Thumbnail Image -->
  <div class="thumbnail-wrapper">
    <img
      [src]="course().thumbnailUrl"
      [alt]="course().title"
      class="thumbnail-img"
      loading="lazy" />
    <div class="thumbnail-overlay"></div>
    <span class="subject-tag-pill">{{ course().subjectName }}</span>
  </div>

  <!-- Left Side (RTL): Course Info & Progress Details -->
  <div class="course-info-group">
    <!-- Header: Title & Lessons Count -->
    <div class="info-top-row">
      <h3 class="course-title">{{ course().title }}</h3>
      <span class="lessons-count">
        {{ course().completedLessons }}/{{ course().totalLessons }} محاضرة
      </span>
    </div>

    <!-- Teacher Name -->
    <span class="teacher-name">{{ course().teacherName }}</span>

    <!-- Progress Bar Track -->
    <div class="progress-bar-track">
      <div
        class="progress-bar-fill"
        [style.width.%]="course().progressPercent"
        [style.background]="course().progressGradient"></div>
    </div>

    <!-- Bottom Row: Progress Percent & Resume Button -->
    <div class="info-bottom-row">
      <div class="progress-label-group">
        <span class="progress-percent">{{ course().progressPercent }}%</span>
        <span class="progress-text">إنجاز الكورس</span>
      </div>

      <button type="button" class="btn-resume" (click)="onResume()">
        <svg
          class="play-icon"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polygon points="10 8 16 12 10 16 10 8" />
        </svg>
        <span>استئناف المشاهدة</span>
      </button>
    </div>
  </div>
</article>
