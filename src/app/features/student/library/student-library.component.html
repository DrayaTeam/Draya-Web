<div class="library-page-container">
  <!-- Ambient Background Gradient Blobs -->
  <div class="blob blob-top"></div>
  <div class="blob blob-bottom"></div>

  <!-- Page Header -->
  <header class="page-header">
    <div class="badge-pill">
      <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="#FD9A00" stroke-width="2">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
      <span>المكتبة الأكاديمية الرقمية</span>
    </div>

    <h1 class="main-title">مكتبة المذكرات والكتب الدراسية</h1>
    <p class="subtitle">
      استعرض الكتب والمذكرات الأكاديمية والملخصات المرفقة بموادك الدراسية للتحميل والمذاكرة أوفلاين.
    </p>
  </header>

  <!-- Search Section Card -->
  <section class="search-card">
    <div class="search-input-wrapper">
      <input
        type="text"
        class="search-input"
        placeholder="بحث باسم الكتاب، المادة، أو الفصل الدراسي..."
        [value]="libraryService.searchQuery()"
        (input)="onSearchChange($event)" />
      <svg
        class="search-icon"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
  </section>

  <!-- Books Grid -->
  <section class="books-grid">
    @for (book of books(); track book.id) {
      <app-book-card
        [book]="book"
        (download)="onDownload($event)"
        (preview)="onPreview($event)"></app-book-card>
    } @empty {
      <div class="empty-state">
        <svg
          class="empty-icon"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
        <p class="empty-text">لم يتم العثور على كتب تطابق البحث الحالي.</p>
      </div>
    }
  </section>
</div>
