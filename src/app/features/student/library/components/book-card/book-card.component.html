<div class="book-card">
  <!-- Book Cover Image Section -->
  <div class="cover-wrapper">
    <img
      [src]="book().coverImageUrl"
      [alt]="book().title"
      class="cover-img"
    />
    <div class="cover-overlay"></div>

    <span
      class="subject-tag-pill"
      [style.background-color]="book().subjectTagBgColor"
    >
      {{ book().subjectName }}
    </span>
  </div>

  <!-- Book Info & Actions Section -->
  <div class="details-body">
    <h3 class="book-title" [title]="book().title">
      {{ book().title }}
    </h3>

    <div class="meta-line">
      <span>{{ book().pagesCount }} صفحة</span>
      <span class="dot-separator">•</span>
      <span>{{ book().fileSizeMb }} MB</span>
      <span class="dot-separator">•</span>
      <span class="format-tag">{{ book().fileFormat }}</span>
    </div>

    <div class="card-actions">
      <button
        type="button"
        class="action-btn download-btn"
        (click)="download.emit(book())"
      >
        <svg class="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span>تحميل</span>
      </button>

      <button
        type="button"
        class="action-btn preview-btn"
        (click)="preview.emit(book())"
      >
        <svg class="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        <span>معاينة</span>
      </button>
    </div>
  </div>
</div>
