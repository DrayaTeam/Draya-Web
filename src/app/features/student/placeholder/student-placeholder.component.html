<div class="placeholder-page-root animate-fade-in">
  <div class="placeholder-card-inner">
    <!-- Top Badge -->
    <span class="status-badge-pill">{{ meta().badge }}</span>

    <!-- Feature Icon Circle -->
    <div class="icon-hero-circle">
      <svg
        width="36"
        height="36"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#1B6D63"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round">
        @switch (meta().icon) {
          @case ('courses') {
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
          }
          @case ('exams') {
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
          }
          @case ('reports') {
            <line x1="18" y1="20" x2="18" y2="10" />
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="6" y1="20" x2="6" y2="14" />
          }
          @case ('library') {
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
          }
          @default {
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="16" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12.01" y2="8" />
          }
        }
      </svg>
    </div>

    <!-- Title & Description -->
    <h1 class="main-title">{{ meta().title }}</h1>
    <p class="sub-description">{{ meta().subtitle }}</p>

    <!-- Mock Stats Grid -->
    @if (meta().mockStats.length > 0) {
      <div class="mock-stats-row">
        @for (st of meta().mockStats; track st.label) {
          <div class="stat-box-item">
            <span class="st-val">{{ st.value }}</span>
            <span class="st-lbl">{{ st.label }}</span>
          </div>
        }
      </div>
    }

    <!-- Return to Dashboard CTA -->
    <a routerLink="/student/dashboard" class="btn-return-dashboard">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12" />
        <polyline points="12 19 5 12 12 5" />
      </svg>
      <span>العودة للرئيسية ولوحة التحكم</span>
    </a>
  </div>
</div>
