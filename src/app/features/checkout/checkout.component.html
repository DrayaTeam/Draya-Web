<div class="checkout-page-container">
  <div class="checkout-card">
    <div class="checkout-header">
      <h1 class="checkout-title">إتمام الاشتراك</h1>
      <p class="checkout-subtitle">اختر وسيلة الدفع لتفعيل باقتك المختارة</p>
    </div>

    <!-- Order Summary Box -->
    <div class="summary-box">
      <div class="summary-row">
        <span class="summary-label">الباقة المختارة:</span>
        <span class="summary-val font-bold">باقة المعلم المحترف (Pro)</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">دورة الفوترة:</span>
        <span class="summary-val">شهري</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-row total-row">
        <span class="total-label">الإجمالي المطلوب:</span>
        <span class="total-val">450 ج.م</span>
      </div>
    </div>

    <!-- Payment Methods Placeholder -->
    <div class="payment-methods">
      <label class="method-card active">
        <input type="radio" name="payment" checked />
        <span>بطاقة بنكية (فيزا / ماستركارد)</span>
      </label>
      <label class="method-card">
        <input type="radio" name="payment" />
        <span>محفظة إلكترونية (فودافون كاش / إنستاباي)</span>
      </label>
    </div>

    <button type="button" class="btn-checkout-pay">متابعة الدفع عبر Paymob</button>

    <div class="checkout-footer">
      <a routerLink="/" class="back-link">← العودة للرئيسية</a>
    </div>
  </div>
</div>
