<div class="auth-page-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#fff"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
          <path d="M6 12v5c3 3 9 3 12 0v-5" />
        </svg>
      </div>
      <h1 class="auth-title">{{ 'AUTH.REGISTER.TITLE' | translate }}</h1>
      <p class="auth-subtitle">{{ 'AUTH.REGISTER.SUBTITLE' | translate }}</p>
    </div>

    <!-- Role Selector Tabs -->
    <div class="role-selector">
      <button
        type="button"
        class="role-btn"
        [class.active]="selectedRole() === 'student'"
        (click)="setRole('student')">
        طالب
      </button>
      <button
        type="button"
        class="role-btn"
        [class.active]="selectedRole() === 'teacher'"
        (click)="setRole('teacher')">
        معلم
      </button>
      <button
        type="button"
        class="role-btn"
        [class.active]="selectedRole() === 'parent'"
        (click)="setRole('parent')">
        ولي أمر
      </button>
    </div>

    <!-- Form Placeholder -->
    <form class="auth-form" (submit)="onSubmit($event)">
      <div class="form-group">
        <label for="reg-name" class="form-label">الاسم الكامل</label>
        <input
          id="reg-name"
          type="text"
          class="form-input"
          placeholder="أدخل اسمك الكامل"
          required />
      </div>

      <div class="form-group">
        <label for="reg-email" class="form-label">البريد الإلكتروني</label>
        <input
          id="reg-email"
          type="email"
          class="form-input"
          placeholder="example@draya.app"
          required />
      </div>

      <div class="form-group">
        <label for="reg-password" class="form-label">كلمة المرور</label>
        <input
          id="reg-password"
          type="password"
          class="form-input"
          placeholder="••••••••"
          required />
      </div>

      <button type="submit" class="btn-submit">إنشاء الحساب</button>
    </form>

    <div class="auth-footer">
      <span>لديك حساب بالفعل؟</span>
      <a routerLink="/auth/login" class="auth-link">تسجيل الدخول</a>
    </div>
  </div>
</div>
