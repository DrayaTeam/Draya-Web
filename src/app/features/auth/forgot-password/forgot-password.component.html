<div class="auth-page-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#fff"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>
      <h1 class="auth-title">استعادة كلمة المرور</h1>
      <p class="auth-subtitle">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور.</p>
    </div>

    <form class="auth-form" (submit)="onSubmit($event)">
      <div class="form-group">
        <label for="fp-email" class="form-label">البريد الإلكتروني</label>
        <input
          id="fp-email"
          type="email"
          class="form-input"
          placeholder="example@draya.app"
          required />
      </div>

      <button type="submit" class="btn-submit">إرسال رابط الاستعادة</button>
    </form>

    <div class="auth-footer">
      <a routerLink="/auth/login" class="auth-link">← العودة لتسجيل الدخول</a>
    </div>
  </div>
</div>
