<!-- Full-height centered login layout — logical padding (ps-/pe-) -->
<div class="bg-background flex min-h-screen items-center justify-center px-4">
  <div class="border-border bg-card w-full max-w-sm space-y-6 rounded-xl border p-8 shadow-sm">
    <!-- Header -->
    <div class="space-y-1">
      <h1 class="text-foreground text-2xl font-bold">
        {{ 'app.name' | translate }}
      </h1>
      <p class="text-muted-foreground text-sm">
        {{ 'auth.login' | translate }}
      </p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="space-y-1">
        <label class="text-foreground block text-sm font-medium" for="login-email">
          {{ 'auth.email' | translate }}
        </label>
        <input
          id="login-email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          class="border-border bg-input-background text-foreground placeholder:text-muted-foreground focus:ring-ring w-full rounded-md border px-3 py-2 text-sm focus:ring-2 focus:outline-none" />
      </div>

      <div class="space-y-1">
        <label class="text-foreground block text-sm font-medium" for="login-password">
          {{ 'auth.password' | translate }}
        </label>
        <input
          id="login-password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          class="border-border bg-input-background text-foreground placeholder:text-muted-foreground focus:ring-ring w-full rounded-md border px-3 py-2 text-sm focus:ring-2 focus:outline-none" />
      </div>

      @if (errorMessage()) {
        <p class="text-destructive text-sm">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="bg-primary text-primary-foreground w-full rounded-md px-4 py-2 text-sm font-semibold transition-opacity hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50">
        @if (loading()) {
          {{ 'common.loading' | translate }}
        } @else {
          {{ 'auth.loginButton' | translate }}
        }
      </button>
    </form>
  </div>
</div>
