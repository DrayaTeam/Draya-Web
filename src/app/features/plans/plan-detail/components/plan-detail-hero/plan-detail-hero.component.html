<!-- Sticky Top Navigation Header -->
<header class="detail-sticky-header">
  <div class="header-inner">
    <!-- Brand Logo -->
    <draya-logo size="sm" />

    <!-- Left Links & Action -->
    <div class="header-actions">
      <a routerLink="/plans" class="btn-back-plans">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M12 19l7-7-7-7" />
        </svg>
        <span>العودة لمقارنة الخطط</span>
      </a>

      <button type="button" (click)="onCheckout()" class="btn-header-cta">
        الاشتراك والدفع الآن
      </button>
    </div>
  </div>
</header>

<!-- Main Hero Banner Section -->
<section class="detail-hero-section" [class.hero-basic]="plan().id === 'basic'">
  <!-- Decorative Ambient Blobs -->
  <div class="blob-glow blob-teal" aria-hidden="true"></div>
  <div class="blob-glow blob-purple" aria-hidden="true"></div>

  <div class="hero-container-grid">
    <!-- Right Content Column (in RTL) -->
    <div class="hero-text-col">
      <!-- Pill Badge -->
      <div class="hero-badge-pill">
        <span class="badge-icon">✨</span>
        <span>{{ plan().badge }}</span>
      </div>

      <!-- Main Plan Title -->
      <h1 class="hero-main-title">
        {{ plan().name }}
      </h1>

      <!-- Tagline Description -->
      <p class="hero-tagline-text">
        {{ plan().tagline }}
      </p>

      <!-- Price & Billing Display -->
      <div class="hero-price-row">
        <span class="hero-price-num">{{ plan().price }}</span>
        <span class="hero-price-sub">{{ plan().period }}</span>
      </div>

      <!-- Action Button -->
      <div class="hero-cta-wrap">
        <button type="button" (click)="onCheckout()" class="btn-hero-pay">
          <span>الاشتراك والدفع الآن</span>
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Left Image Feature Card (in RTL) -->
    <div class="hero-card-col">
      <div class="hero-image-frame">
        <img [src]="plan().heroImg" alt="{{ plan().name }}" class="hero-card-img" />
        <div class="hero-img-overlay"></div>

        <!-- Floating Target Audience Box -->
        <div class="target-audience-box">
          <span class="target-title">الفئة المستهدفة:</span>
          <span class="target-desc">{{ plan().target }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
