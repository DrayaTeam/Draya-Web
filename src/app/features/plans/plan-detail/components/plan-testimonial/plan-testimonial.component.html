<!-- Testimonial Quote Banner Section -->
<section class="testimonial-banner-card">
  <div class="quote-content-col">
    <!-- Star Rating -->
    <div class="star-rating-row">
      <span>★</span>
      <span>★</span>
      <span>★</span>
      <span>★</span>
      <span>★</span>
    </div>

    <!-- Main Quote Text -->
    <p class="quote-body-text">"{{ quote().text }}"</p>

    <!-- Author & Meta -->
    <div class="quote-author-meta">
      <div class="author-name-text">{{ quote().author }}</div>
      <div class="author-role-text">{{ quote().role }}</div>
    </div>
  </div>

  <!-- Action CTA -->
  <button type="button" (click)="onCheckout()" class="btn-testimonial-cta">
    اشترك الآن مثل المعلمين المميزين
  </button>
</section>
