<!-- FAQ Section -->
<section class="detail-faq-section">
  <!-- Section Heading -->
  <div class="faq-header-box">
    <h2 class="faq-title">
      <span>الأسئلة الشائعة عن</span>
      <span class="highlight-name">{{ planName() }}</span>
    </h2>
    <p class="faq-subtitle">
      إليك الإجابات عن أكثر الأسئلة الشائعة المتعلقة بطريقة التفعيل والدفع لهذه الباقة.
    </p>
  </div>

  <!-- Accordion List -->
  <div class="faq-accordion-list">
    @for (faq of faqs(); track faq.q; let idx = $index) {
      <div class="faq-card-row" [class.is-open]="openFaqIndex() === idx">
        <button type="button" (click)="toggleFaq(idx)" class="faq-row-btn">
          <span class="faq-question-text">{{ faq.q }}</span>
          <div class="faq-chevron-icon" [class.rotated]="openFaqIndex() === idx">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#0F4F49"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </div>
        </button>

        @if (openFaqIndex() === idx) {
          <div class="faq-answer-box">
            <p class="faq-answer-text">{{ faq.a }}</p>
          </div>
        }
      </div>
    }
  </div>
</section>
