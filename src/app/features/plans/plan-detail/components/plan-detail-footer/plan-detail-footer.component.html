<!-- Footer Banner Section -->
<footer class="detail-bottom-footer">
  <div class="footer-inner-box">
    <!-- Right Info Text (in RTL) -->
    <div class="footer-info-col">
      <h3 class="footer-main-title">
        <span>جاهز للبدء مع</span>
        <span class="plan-name-text">{{ planName() }}</span>
        <span>؟</span>
      </h3>
      <p class="footer-sub-text">ابدأ الآن في تجهيز دروسك وفصولك الدراسية بسهولة وسرعة.</p>
    </div>

    <!-- Left CTA Action (in RTL) -->
    <button type="button" (click)="onCheckout()" class="btn-footer-checkout">
      الانتقال لصفحة الدفع والتأكيد
    </button>
  </div>
</footer>
