@if (currentPlanId() === 'enterprise') {
  <draya-enterprise-contact />
} @else {
  <div
    class="flex min-h-screen flex-col bg-[#FAFAF8] font-sans text-slate-900 selection:bg-teal-500 selection:text-white">
    <!-- Main Banner Hero & Sticky Header -->
    <draya-plan-detail-hero [plan]="plan()" (checkout)="proceedToCheckout()" />

    <!-- Main Content Body -->
    <main class="mx-auto flex w-full max-w-7xl flex-col gap-16 px-4 py-16 sm:px-6">
      @if (isLoading()) {
        <div class="animate-pulse space-y-8">
          <app-skeleton-loader variant="rect" width="100%" height="240px" className="rounded-2xl" />
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
            <app-skeleton-loader
              variant="rect"
              width="100%"
              height="320px"
              className="rounded-2xl" />
            <app-skeleton-loader
              variant="rect"
              width="100%"
              height="320px"
              className="rounded-2xl" />
          </div>
        </div>
      } @else {
        <!-- Features Checklist Matrix -->
        <div class="animate-fade-in-up">
          <draya-plan-features-matrix
            [planId]="plan().id"
            [planName]="plan().name"
            [features]="plan().features"
            [unavailable]="plan().unavailable" />
        </div>

        <!-- Testimonial Quote Section -->
        <div class="animate-fade-in-up delay-200">
          <draya-plan-testimonial
            [planId]="plan().id"
            [quote]="plan().quote"
            (checkout)="proceedToCheckout()" />
        </div>

        <!-- FAQ Accordion Section -->
        <div class="animate-fade-in-up delay-300">
          <draya-plan-faq [planId]="plan().id" [planName]="plan().name" [faqs]="plan().faqs" />
        </div>
      }
    </main>

    <!-- Footer CTA Banner -->
    <draya-plan-detail-footer
      [planId]="plan().id"
      [planName]="plan().name"
      (checkout)="proceedToCheckout()" />
  </div>
}
