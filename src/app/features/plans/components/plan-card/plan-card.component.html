<div
  class="plan-card"
  [class.card-featured]="plan().featured"
  [class.card-enterprise]="plan().isGradient"
  [class.card-basic]="!plan().featured && !plan().isGradient">
  <!-- Recommended Badge -->
  @if (plan().featured) {
    <div class="recommended-badge">
      <svg
        width="12"
        height="12"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#FDE68A"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="animate-spin-slow">
        <path
          d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
      </svg>
      <span>موصى به 🔥</span>
    </div>
  }

  <!-- Enterprise Badge -->
  @if (plan().isGradient) {
    <div class="enterprise-badge-wrapper">
      <span class="enterprise-badge">مخصص</span>
    </div>
  }

  <h3 class="plan-name">
    {{ plan().name }}
  </h3>

  <!-- Price Row -->
  <div class="price-row">
    <span class="price-amount">
      {{ billingAnnual() ? plan().priceAnnual : plan().priceMonthly }}
    </span>
    @if (plan().featured) {
      <span class="price-unit">جنيه / شهر</span>
    }
  </div>

  <p class="plan-subtitle">
    {{ plan().sub }}
  </p>

  <!-- Feature List -->
  <div class="plan-features">
    @for (f of plan().feats; track f) {
      <div class="feature-item">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          class="check-svg"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
          <polyline points="22 4 12 14.01 9 11.01" />
        </svg>
        <span class="feature-label">
          {{ f }}
        </span>
      </div>
    }
  </div>

  <!-- Buttons -->
  <div class="plan-actions">
    <button type="button" (click)="onSelect($event)" class="btn-plan-cta">
      {{ plan().cta }}
    </button>

    <button type="button" (click)="onDetail($event)" class="btn-plan-link">
      استعرض تفاصيل ومميزات الباقة بالكامل ←
    </button>
  </div>
</div>
