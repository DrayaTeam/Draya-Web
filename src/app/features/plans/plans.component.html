<div class="choose-plan-page">
  <!-- Header with Wizard Stepper -->
  <draya-plans-header />

  <!-- Main Content Container -->
  <main class="choose-plan-main">
    <!-- Title & Subtitle Section -->
    <div class="title-section-box">
      <h1 class="main-page-title">اختر خطة الاشتراك المناسبة لك</h1>
      <p class="main-page-subtitle">
        جميع الخطط تشمل دعماً فنياً ودورات تدريبية سريعة. لا توجد رسوم مخفية.
      </p>

      <!-- Billing Cycle Toggle Switch Pill -->
      <div class="billing-toggle-pill">
        <button
          type="button"
          (click)="toggleBilling(false)"
          class="btn-toggle-option"
          [class.active-pill]="!billingAnnual()">
          اشتراك شهري
        </button>
        <button
          type="button"
          (click)="toggleBilling(true)"
          class="btn-toggle-option"
          [class.active-pill]="billingAnnual()">
          <span>اشتراك سنوي (توفير 20%)</span>
        </button>
      </div>
    </div>

    <!-- Pricing Cards Grid (3 Columns) -->
    <div class="plans-cards-grid">
      @if (isLoading()) {
        <!-- Skeleton Card Loaders -->
        @for (i of [1, 2, 3]; track i) {
          <div
            class="flex h-[520px] animate-pulse flex-col justify-between rounded-2xl border border-[#ebefef] bg-white p-8">
            <div>
              <app-skeleton-loader variant="text" width="60%" height="24px" className="mb-4" />
              <app-skeleton-loader variant="rect" width="40%" height="40px" className="mb-6" />
              <app-skeleton-loader variant="text" width="80%" height="16px" className="mb-8" />
              <div class="space-y-3">
                <app-skeleton-loader variant="text" width="90%" height="14px" />
                <app-skeleton-loader variant="text" width="85%" height="14px" />
                <app-skeleton-loader variant="text" width="75%" height="14px" />
                <app-skeleton-loader variant="text" width="95%" height="14px" />
              </div>
            </div>
            <app-skeleton-loader
              variant="rect"
              width="100%"
              height="44px"
              className="rounded-full" />
          </div>
        }
      } @else {
        @for (plan of plans; track plan.id; let idx = $index) {
          <div class="animate-fade-in-up" [class]="'delay-' + (idx + 1) * 100">
            <draya-plan-card
              [plan]="plan"
              [billingAnnual]="billingAnnual()"
              (planSelected)="onSelectPlan($event.planId)"
              (planDetailSelected)="onNavigateToDetail($event.planId)" />
          </div>
        }
      }
    </div>
  </main>
</div>
