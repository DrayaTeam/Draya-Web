  <!-- PROTOTYPE: Dribbble Bento Hub -->
  <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mb-10">
    
    <!-- Main Hero Card -->

      <!-- Decorative Dribbble-style abstract shape -->
      <div class="absolute -top-32 -right-32 w-96 h-96 bg-gradient-to-br from-teal-500/20 to-purple-500/20 rounded-full blur-[80px] pointer-events-none group-hover:scale-110 transition-transform duration-1000 ease-out"></div>
      
      <div class="relative z-10 flex flex-col gap-3">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-teal-400 shadow-[0_0_10px_rgba(45,212,191,0.8)]"></div>

    <!-- Right Side (Stats & Search) -->

      <div class="bg-white rounded-[24px] p-3 border border-slate-200/60 shadow-[0_4px_20px_rgba(0,0,0,0.03)] flex items-center focus-within:ring-4 focus-within:ring-teal-500/10 focus-within:border-teal-500 transition-all">
        <div class="w-12 h-12 bg-slate-50 rounded-[16px] flex items-center justify-center text-slate-400">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <input type="text" class="flex-1 bg-transparent border-0 py-3 pr-4 pl-4 text-slate-800 font-semibold placeholder-slate-400 focus:outline-none" placeholder="ابحث باسم المرحلة..." (input)="onSearch($event)">

      <!-- Stats Widget -->
      <div class="bg-white rounded-[28px] p-8 border border-slate-200/60 shadow-[0_4px_20px_rgba(0,0,0,0.03)] flex flex-col justify-between flex-1 relative overflow-hidden group">

        <div class="relative z-10 flex justify-between items-start">
          <div class="flex flex-col gap-2">
            <span class="text-slate-500 text-sm font-semibold">إجمالي المراحل</span>
            <div class="flex items-baseline gap-2">
              <span class="text-5xl font-black text-slate-900 tracking-tighter">{{ classroomsResult()?.totalCount || 0 }}</span>
              <span class="text-teal-600 font-bold bg-teal-50 px-2 py-1 rounded-md text-xs">نشط</span>
            </div>
          </div>
          <div class="w-14 h-14 rounded-[18px] bg-teal-50/80 border border-teal-100 flex items-center justify-center rotate-3 group-hover:rotate-0 transition-transform duration-300">

          </div>
        </div>
        
        <!-- Dribbble style progress bar -->
        <div class="relative z-10 mt-8 flex flex-col gap-2">
          <div class="flex justify-between text-[10px] font-bold text-slate-400 uppercase tracking-widest">
            <span>سعة النظام</span>
            <span>%75</span>
          </div>
          <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-slate-900 w-3/4 rounded-full"></div>
          </div>
        </div>
      </div>
      
    </div>
