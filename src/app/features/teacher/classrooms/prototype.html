<!-- PROTOTYPE: Dribbble Bento Hub -->
<div class="mb-10 grid grid-cols-1 gap-4 md:grid-cols-12">
  <!-- Main Hero Card -->
  <div
    class="group relative col-span-1 flex min-h-[240px] flex-col justify-between overflow-hidden rounded-[28px] bg-[#111827] p-8 shadow-lg md:col-span-7 md:p-10">
    <!-- Decorative Dribbble-style abstract shape -->
    <div
      class="pointer-events-none absolute -top-32 -right-32 h-96 w-96 rounded-full bg-gradient-to-br from-teal-500/20 to-purple-500/20 blur-[80px] transition-transform duration-1000 ease-out group-hover:scale-110"></div>

    <div class="relative z-10 flex flex-col gap-3">
      <div class="flex items-center gap-2">
        <div class="h-2 w-2 rounded-full bg-teal-400 shadow-[0_0_10px_rgba(45,212,191,0.8)]"></div>
        <span class="text-xs font-semibold tracking-[0.15em] text-teal-400 uppercase">
          إدارة الأكاديمية
        </span>
      </div>
      <h1 class="m-0 text-4xl leading-tight font-black tracking-tight text-white md:text-5xl">
        الفصول
        <br />
        الدراسية
      </h1>
    </div>

    <div class="relative z-10 mt-10">
      <button
        class="flex items-center gap-3 rounded-2xl bg-white px-8 py-3.5 font-bold text-slate-900 shadow-xl transition-all hover:-translate-y-0.5 hover:bg-slate-50 hover:shadow-2xl"
        (click)="openCreateModal()">
        <span
          class="flex h-6 w-6 items-center justify-center rounded-full bg-teal-100 text-lg leading-none text-teal-700">
          +
        </span>
        إنشاء فصل جديد
      </button>
    </div>
  </div>

  <!-- Right Side (Stats & Search) -->
  <div class="col-span-1 flex flex-col gap-4 md:col-span-5">
    <!-- Search Widget (Modern Floating Pill style) -->
    <div
      class="flex items-center rounded-[24px] border border-slate-200/60 bg-white p-3 shadow-[0_4px_20px_rgba(0,0,0,0.03)] transition-all focus-within:border-teal-500 focus-within:ring-4 focus-within:ring-teal-500/10">
      <div
        class="flex h-12 w-12 items-center justify-center rounded-[16px] bg-slate-50 text-slate-400">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <input
        type="text"
        class="flex-1 border-0 bg-transparent py-3 pr-4 pl-4 font-semibold text-slate-800 placeholder-slate-400 focus:outline-none"
        placeholder="ابحث باسم المرحلة..."
        (input)="onSearch($event)" />
    </div>

    <!-- Stats Widget -->
    <div
      class="group relative flex flex-1 flex-col justify-between overflow-hidden rounded-[28px] border border-slate-200/60 bg-white p-8 shadow-[0_4px_20px_rgba(0,0,0,0.03)]">
      <div
        class="pointer-events-none absolute -bottom-6 -left-6 h-32 w-32 rounded-full bg-slate-50 transition-transform duration-700 ease-out group-hover:scale-150"></div>

      <div class="relative z-10 flex items-start justify-between">
        <div class="flex flex-col gap-2">
          <span class="text-sm font-semibold text-slate-500">إجمالي المراحل</span>
          <div class="flex items-baseline gap-2">
            <span class="text-5xl font-black tracking-tighter text-slate-900">
              {{ classroomsResult()?.totalCount || 0 }}
            </span>
            <span class="rounded-md bg-teal-50 px-2 py-1 text-xs font-bold text-teal-600">نشط</span>
          </div>
        </div>
        <div
          class="flex h-14 w-14 rotate-3 items-center justify-center rounded-[18px] border border-teal-100 bg-teal-50/80 transition-transform duration-300 group-hover:rotate-0">
          <svg class="h-7 w-7 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
          </svg>
        </div>
      </div>

      <!-- Dribbble style progress bar -->
      <div class="relative z-10 mt-8 flex flex-col gap-2">
        <div
          class="flex justify-between text-[10px] font-bold tracking-widest text-slate-400 uppercase">
          <span>سعة النظام</span>
          <span>%75</span>
        </div>
        <div class="h-2 w-full overflow-hidden rounded-full bg-slate-100">
          <div class="h-full w-3/4 rounded-full bg-slate-900"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- END PROTOTYPE -->
