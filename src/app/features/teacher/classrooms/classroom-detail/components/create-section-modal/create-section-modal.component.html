<draya-teacher-modal
  [title]="'TEACHER.SECTIONS.ADD_SECTION' | translate"
  [isOpen]="isOpen()"
  size="md"
  (modalClosed)="modalClosed.emit()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="draya-form">
    <div class="form-group">
      <label for="title" class="required">{{ 'TEACHER.SECTIONS.TITLE_LABEL' | translate }}</label>
      <input id="title" type="text" formControlName="title" class="form-control" />
      @if (form.get('title')?.invalid && form.get('title')?.touched) {
        <small class="error-text">هذا الحقل مطلوب</small>
      }
    </div>

    <div class="form-group mt-4">
      <label for="description">{{ 'TEACHER.SECTIONS.DESCRIPTION_LABEL' | translate }}</label>
      <textarea id="description" formControlName="description" class="form-control" rows="3"></textarea>
    </div>

    <div class="form-group mt-4">
      <label for="order">{{ 'TEACHER.SECTIONS.ORDER_LABEL' | translate }}</label>
      <input id="order" type="number" formControlName="order" class="form-control" />
    </div>

    <div modal-footer class="flex gap-3">
      <button type="button" class="btn-outline" (click)="modalClosed.emit()">
        إلغاء
      </button>
      <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <i class="pi pi-spinner pi-spin ml-2"></i>
        }
        {{ 'TEACHER.SECTIONS.ADD_SECTION' | translate }}
      </button>
    </div>
  </form>
</draya-teacher-modal>
