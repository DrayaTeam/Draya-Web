<p-dialog 
  [visible]="isOpen()" 
  [modal]="true" 
  [closable]="false" 
  [draggable]="false" 
  [resizable]="false" 
  [showHeader]="false"
  styleClass="draya-headless-dialog"
  [style]="{ width: 'calc(100% - 32px)', maxWidth: '600px', margin: '16px auto' }"
  [contentStyle]="{ padding: '0', borderRadius: '16px', overflow: 'hidden' }"
  (onHide)="cancelUpload.emit()">
  
  <div class="modal-content" dir="rtl">
    <!-- Header -->
    <div class="modal-header">
      <div>
        <h2 class="modal-title">إضافة مادة تعليمية جديدة</h2>
        <p class="modal-subtitle">قم برفع ملف مستند أو فيديو لطلابك</p>
      </div>
      <button class="close-btn" (click)="cancelUpload.emit()" aria-label="Close modal">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <form [formGroup]="form" (ngSubmit)="submit()" class="draya-form">
        
        <!-- Type -->
        <div class="field-group">
          <label for="type">نوع المادة التعليمية</label>
          <select
            id="type"
            formControlName="type"
            class="form-select"
            (change)="onTypeChange()">
            @for (opt of typeOptions; track opt.value) {
              <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>
        </div>

        <!-- Title -->
        <div class="field-group">
          <label for="title">عنوان المادة <span class="text-red-500">*</span></label>
          <input
            id="title"
            type="text"
            formControlName="title"
            class="form-input"
            placeholder="مثال: مذكرة مراجعة الباب الأول"
            [class.has-error]="form.get('title')?.invalid && form.get('title')?.touched" />
          @if (form.get('title')?.invalid && form.get('title')?.touched) {
            <span class="error-msg">
              عنوان المادة مطلوب (الحد الأقصى 255 حرف).
            </span>
          }
        </div>

        <!-- Description -->
        <div class="field-group">
          <label for="description">وصف تفصيلي (اختياري)</label>
          <textarea
            id="description"
            formControlName="description"
            class="form-input min-h-[100px] resize-y"
            placeholder="أضف ملاحظات أو تعليمات للطلاب حول هذه المادة..."></textarea>
        </div>

        <!-- File Upload Section -->
        <div class="field-group mt-2">
          <label for="fileUpload">ملف {{ currentType === 'PDF' ? 'المستند (PDF/Word/etc)' : 'الفيديو' }} <span class="text-red-500">*</span></label>
          <div class="file-upload-box" [class.has-error]="fileError()">
            <input
              type="file"
              id="fileUpload"
              (change)="onFileSelect($event)"
              class="hidden" />

            <label for="fileUpload" class="file-upload-label">
              <i class="pi pi-cloud-upload text-primary-600 mb-2 text-3xl"></i>
              @if (selectedFile()) {
                <span class="font-semibold text-gray-900">{{ selectedFile()!.name }}</span>
                <span class="mt-1 text-xs text-gray-500">
                  {{ selectedFile()!.size / 1024 / 1024 | number: '1.1-2' }} MB
                </span>
              } @else {
                <span class="font-semibold text-gray-900">اضغط هنا لاختيار ملف</span>
                <span class="mt-1 text-xs text-gray-500">
                  مسموح بجميع أنواع الملفات (الحد الأقصى 200MB)
                </span>
              }
            </label>
          </div>
          @if (fileError()) {
            <span class="error-msg">{{ fileError() }}</span>
          }
        </div>

      </form>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn-cancel" (click)="cancelUpload.emit()" [disabled]="isSubmitting()">إلغاء</button>
      <button class="btn-submit" (click)="submit()" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span>جاري الرفع...</span>
        }
        @if (!isSubmitting()) {
          <span>حفظ ورفع المادة</span>
        }
      </button>
    </div>
  </div>
</p-dialog>
