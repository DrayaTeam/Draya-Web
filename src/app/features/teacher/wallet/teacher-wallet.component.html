<div class="animate-fade-in mx-auto w-full max-w-[1280px] p-4 md:p-8" dir="rtl">
  <!-- Page Header -->
  <header class="mb-8 flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
    <div class="flex items-center gap-4">
      <div
        class="flex h-14 w-14 shrink-0 items-center justify-center rounded-[12px] bg-teal-50 text-teal-600">
        <i class="pi pi-wallet text-2xl"></i>
      </div>
      <div>
        <div class="mb-1 flex items-center gap-2">
          <h1 class="m-0 text-3xl font-bold text-teal-700">المحفظة المالية</h1>
        </div>
        <p class="m-0 mt-1 text-gray-500">إدارة أرباحك، سحب الأموال، وشحن رصيد المنصة.</p>
      </div>
    </div>
  </header>

  @if (isLoadingBalance()) {
    <div class="flex flex-col items-center justify-center py-12">
      <div
        class="spinner-border inline-block h-8 w-8 animate-spin rounded-full border-4 border-t-teal-600 border-r-transparent"
        role="status"></div>
      <p class="mt-4 text-gray-500">جاري تحميل بيانات المحفظة...</p>
    </div>
  } @else {
    <div class="flex flex-col gap-8">
      <!-- Top Section: Balances -->
      <draya-wallet-balance-card
        [balance]="balance()"
        (topUp)="handleTopUp()"
        (withdraw)="handleWithdraw()"></draya-wallet-balance-card>

      <!-- Middle Section: Payout Accounts (Instapay) -->
      <draya-payout-accounts
        (withdrawRequested)="handleWithdrawToAccount($event)"></draya-payout-accounts>

      <!-- Bottom Section: Transactions History -->
      <draya-wallet-transactions></draya-wallet-transactions>
    </div>
  }

  <!-- Withdrawal Modal -->
  <draya-withdrawal-modal
    [isOpen]="isWithdrawalModalOpen()"
    [maxAmount]="balance()?.availableEarnedBalance ?? 0"
    [targetAccount]="selectedPayoutAccount()"
    (closed)="isWithdrawalModalOpen.set(false)"
    (success)="onWithdrawalSuccess()"></draya-withdrawal-modal>

  <!-- Topup Modal -->
  <draya-topup-modal
    [isOpen]="isTopupModalOpen()"
    (closed)="isTopupModalOpen.set(false)"></draya-topup-modal>
</div>
