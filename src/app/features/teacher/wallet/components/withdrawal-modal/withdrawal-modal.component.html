<!-- src/app/features/teacher/wallet/components/withdrawal-modal/withdrawal-modal.component.html -->
@if (isOpen()) {
  <div class="modal-backdrop animate-fade-in" dir="rtl">
    <div class="modal-content bounce-in">
      <div class="modal-header">
        <h2 class="modal-title">طلب سحب الأرباح</h2>
        <button class="close-btn" (click)="close()" aria-label="إغلاق">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="balance-info mb-6">
          <span class="info-label">الرصيد المتاح للسحب:</span>
          <span class="info-amount">{{ maxAmount() }} ج.م</span>
        </div>

        @if (targetAccount()) {
          <div class="target-account-card mb-6">
            <div class="account-icon">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5M2 12l10 5 10-5"></path>
              </svg>
            </div>
            <div>
              <p class="account-name">
                سيتم التحويل إلى:
                <strong>{{ targetAccount()?.accountName }}</strong>
              </p>
              <p class="account-id" dir="ltr">{{ targetAccount()?.accountIdentifier }}</p>
            </div>
          </div>
        }

        <div class="form-group">
          <label for="withdrawalAmountInput">المبلغ المراد سحبه (ج.م)</label>
          <input
            id="withdrawalAmountInput"
            type="number"
            [ngModel]="amount()"
            (ngModelChange)="amount.set($event)"
            class="form-control amount-input"
            placeholder="0.00"
            [max]="maxAmount()"
            min="10" />
          <button class="btn-text mt-2 text-sm" (click)="amount.set(maxAmount())">
            سحب كل الرصيد
          </button>
        </div>

        @if (errorMessage()) {
          <div class="error-alert mt-4">
            {{ errorMessage() }}
          </div>
        }
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" (click)="close()" [disabled]="isSubmitting()">إلغاء</button>
        <button class="btn-primary" (click)="submit()" [disabled]="isSubmitting() || !amount()">
          @if (isSubmitting()) {
            <span class="spinner-sm"></span>
            جاري التنفيذ...
          } @else {
            تأكيد طلب السحب
          }
        </button>
      </div>
    </div>
  </div>
}
