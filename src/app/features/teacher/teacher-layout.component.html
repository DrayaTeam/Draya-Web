<div class="teacher-portal-layout">
  <!-- Mobile Backdrop Overlay -->
  @if (isMobileSidebarOpen()) {
    <div class="mobile-backdrop-overlay" (click)="closeMobileSidebar()" aria-hidden="true"></div>
  }

  <!-- Sidebar Component (224px width on desktop) -->
  <draya-teacher-sidebar
    [isOpenMobile]="isMobileSidebarOpen()"
    (closeMobile)="closeMobileSidebar()" />

  <!-- Main Content Container -->
  <div class="teacher-main-viewport relative">
    
    <!-- Floating Theme/Locale Controls (Desktop Only) -->
    <div class="hidden lg:flex absolute top-4 left-4 z-40 items-center gap-2" [dir]="localeService.locale() === 'ar' ? 'rtl' : 'ltr'">
      <button
        type="button"
        (click)="themeService.toggleTheme()"
        class="w-10 h-10 rounded-full bg-white border border-gray-100 shadow-sm hover:bg-gray-50 flex items-center justify-center text-gray-600 transition-all">
        @if (themeService.isDarkMode()) {
          <span class="text-amber-500">☀️</span>
        } @else {
          <span>🌙</span>
        }
      </button>
      <button
        type="button"
        (click)="localeService.toggle()"
        class="h-10 px-3 rounded-full bg-white border border-gray-100 shadow-sm hover:bg-gray-50 text-sm font-bold text-gray-600 transition-all">
        {{ localeService.locale() === 'ar' ? 'EN' : 'عربي' }}
      </button>
    </div>

    <draya-connection-status-banner />

    <!-- Top Mobile App Bar (visible < 1024px) -->
    <header class="mobile-top-bar">
      <button
        type="button"
        (click)="toggleMobileSidebar()"
        aria-label="فتح القائمة"
        class="mobile-burger-btn">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <span class="mobile-brand-title">{{ 'TEACHER.SIDEBAR.BRAND_NAME' | translate }}</span>
      
      <!-- Mobile Theme/Locale Controls -->
      <div class="flex items-center gap-2 ms-auto" [dir]="localeService.locale() === 'ar' ? 'rtl' : 'ltr'">
        <button
          type="button"
          (click)="themeService.toggleTheme()"
          class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-600">
          @if (themeService.isDarkMode()) {
            <span class="text-amber-500 text-sm">☀️</span>
          } @else {
            <span class="text-sm">🌙</span>
          }
        </button>
        <button
          type="button"
          (click)="localeService.toggle()"
          class="h-8 px-2 rounded hover:bg-gray-100 text-xs font-bold text-gray-600">
          {{ localeService.locale() === 'ar' ? 'EN' : 'عربي' }}
        </button>
      </div>
    </header>

    <!-- Main Router Outlet Area -->
    <main class="portal-router-content">
      <router-outlet />
    </main>
  </div>
</div>
