<div class="teacher-portal-layout">
  <!-- Mobile Backdrop Overlay -->
  @if (isMobileSidebarOpen()) {
    <div class="mobile-backdrop-overlay" (click)="closeMobileSidebar()" aria-hidden="true"></div>
  }

  <!-- Sidebar Component (224px width on desktop) -->
  <draya-teacher-sidebar
    [isOpenMobile]="isMobileSidebarOpen()"
    (closeMobile)="closeMobileSidebar()" />

  <!-- Main Content Container -->
  <div class="teacher-main-viewport relative">
    <!-- Floating Theme/Locale Controls (Desktop Only) (Hidden) -->
    <div
      class="absolute top-4 left-4 z-40 hidden items-center gap-2 lg:flex"
      style="display: none !important"
      [dir]="localeService.locale() === 'ar' ? 'rtl' : 'ltr'">
      <button
        type="button"
        (click)="themeService.toggleTheme()"
        class="flex h-10 w-10 items-center justify-center rounded-full border border-gray-100 bg-white text-gray-600 shadow-sm transition-all hover:bg-gray-50">
        @if (themeService.isDarkMode()) {
          <span class="text-amber-500">☀️</span>
        } @else {
          <span>🌙</span>
        }
      </button>
      <button
        type="button"
        (click)="localeService.toggle()"
        class="h-10 rounded-full border border-gray-100 bg-white px-3 text-sm font-bold text-gray-600 shadow-sm transition-all hover:bg-gray-50">
        {{ localeService.locale() === 'ar' ? 'EN' : 'عربي' }}
      </button>
    </div>

    <draya-connection-status-banner />

    <!-- Top Mobile App Bar (visible < 1024px) -->
    <header class="mobile-top-bar">
      <button
        type="button"
        (click)="toggleMobileSidebar()"
        aria-label="فتح القائمة"
        class="mobile-burger-btn">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <span class="mobile-brand-title">{{ 'TEACHER.SIDEBAR.BRAND_NAME' | translate }}</span>

      <!-- Mobile Theme/Locale Controls (Hidden) -->
      <div
        class="ms-auto flex items-center gap-2"
        style="display: none !important"
        [dir]="localeService.locale() === 'ar' ? 'rtl' : 'ltr'">
        <button
          type="button"
          (click)="themeService.toggleTheme()"
          class="flex h-8 w-8 items-center justify-center rounded-full text-gray-600 hover:bg-gray-100">
          @if (themeService.isDarkMode()) {
            <span class="text-sm text-amber-500">☀️</span>
          } @else {
            <span class="text-sm">🌙</span>
          }
        </button>
        <button
          type="button"
          (click)="localeService.toggle()"
          class="h-8 rounded px-2 text-xs font-bold text-gray-600 hover:bg-gray-100">
          {{ localeService.locale() === 'ar' ? 'EN' : 'عربي' }}
        </button>
      </div>
    </header>

    <!-- Main Router Outlet Area -->
    <main class="portal-router-content">
      <router-outlet />
    </main>
  </div>
</div>
