<div class="exams-schedule-root">
  <!-- Card Header -->
  <div class="card-header-row">
    <div class="title-icon-grp">
      <div class="icon-amber-circle">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#E17100"
          stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
      </div>
      <h3 class="card-title">جدول الامتحانات القادمة</h3>
    </div>
  </div>

  <!-- Exams List -->
  <div class="exams-list">
    @for (exam of upcomingExams; track exam.id) {
      <div class="exam-item-box">
        <div class="side-accent-bar" [style.background]="exam.borderColor"></div>
        <div class="exam-info-col">
          <span class="ex-title">{{ exam.title }}</span>
          <span class="ex-time">{{ exam.time }}</span>
        </div>
        <span class="tag-pill">{{ exam.tag }}</span>
      </div>
    }
  </div>

  <!-- Action Link Footer -->
  <div class="card-footer-link">
    <a href="#" (click)="$event.preventDefault()" class="btn-all-exams">
      <span>عرض كل الامتحانات ←</span>
    </a>
  </div>
</div>
