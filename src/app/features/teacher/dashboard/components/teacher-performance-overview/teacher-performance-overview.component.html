<div class="performance-card-root">
  <div class="card-header-row">
    <span class="card-title">أداء المواد المتوسط</span>
    <div class="icon-circle-blue">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0084D1" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10" />
        <line x1="12" y1="20" x2="12" y2="4" />
        <line x1="6" y1="20" x2="6" y2="14" />
      </svg>
    </div>
  </div>

  <div class="score-main-row">
    <h3 class="score-number">{{ averageScore() }}%</h3>
    <span class="growth-badge">{{ monthlyGrowth() }}</span>
  </div>

  <span class="percentile-text">{{ percentileText() }}</span>
</div>
