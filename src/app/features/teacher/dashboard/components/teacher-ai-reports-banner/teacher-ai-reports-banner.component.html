<section class="ai-banner-card">
  <div class="ai-banner-content">
    <div class="ai-icon-circle">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#1B6D63"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <polygon
          points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
      </svg>
    </div>

    <div class="ai-banner-text">
      <h2 class="ai-banner-title">{{ aiAlert().titleKey | translate }}</h2>
      <span class="ai-banner-desc">{{ aiAlert().subtitleKey | translate }}</span>
    </div>
  </div>

  <button type="button" (click)="reviewClick.emit()" class="btn-review-now-pill">
    <span>{{ aiAlert().ctaKey | translate }}</span>
    <svg
      width="14"
      height="14"
      class="rtl:rotate-180"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12" />
      <polyline points="12 5 19 12 12 19" />
    </svg>
  </button>
</section>
