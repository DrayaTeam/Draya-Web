<div class="hero-card-root">
  <!-- Decorative background overlays -->
  <div class="bg-blur-glow"></div>

  <div class="hero-card-inner">
    <!-- Top Date Pill -->
    <div class="date-pill-wrapper">
      <span class="sparkle-star">✨</span>
      <span>الأحد، 20 يوليو 2026</span>
    </div>

    <!-- Main Title & Greeting -->
    <h1 class="welcome-heading">أهلاً بعودتك، {{ teacherName() }}!</h1>

    <!-- Subtitle text -->
    <p class="welcome-sub">
      لديك {{ scheduledExamsCount() }} اختباران مجدولان قريباً هذا الأسبوع. واصل الدراسة يومياً
      وحافظ على لهيب حماسك!
    </p>

    <!-- Performance Glow Pill -->
    <div class="performance-glow-pill">
      <span class="star-icon">✨</span>
      <span>مستوى الأداء: ممتاز ✨</span>
    </div>

    <!-- Action Buttons Row -->
    <div class="hero-actions-row">
      <button type="button" (click)="resumeClick.emit()" class="btn-primary-hero">
        <span>تابع من حيث توقفت</span>
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5">
          <polygon points="5 3 19 12 5 21 5 3" />
        </svg>
      </button>

      <button type="button" (click)="browseClick.emit()" class="btn-secondary-hero">
        <span>تصفح المواد الجديدة</span>
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    </div>
  </div>
</div>
