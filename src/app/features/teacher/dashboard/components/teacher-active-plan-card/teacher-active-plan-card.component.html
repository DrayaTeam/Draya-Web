<div class="active-plan-card-root">
  <div class="card-header-row">
    <span class="card-title">الباقات المشترك بها</span>
    <div class="icon-circle-teal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00786F" stroke-width="2">
        <path
          d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
      </svg>
    </div>
  </div>

  <div class="card-val-row">
    <h3 class="packages-count">{{ activePackagesCount() }} باقات</h3>
    <span class="status-sub">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#009689" stroke-width="2">
        <polyline points="20 6 9 17 4 12" />
      </svg>
      {{ statusText() }}
    </span>
  </div>

  <a routerLink="/teacher/subscription" class="btn-manage-sub-link">
    <span>عرض استهلاك العدادات والاشتراك ←</span>
  </a>
</div>
