<div class="improvement-card-root">
  <!-- Card Header -->
  <div class="card-header-row">
    <div class="title-icon-grp">
      <div class="icon-purple-circle">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#9810FA"
          stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v4" />
          <path d="M12 16h.01" />
        </svg>
      </div>
      <h3 class="card-title">نقاط تحسين تحتاج تركيزك</h3>
    </div>
  </div>

  <!-- Points List -->
  <div class="points-list">
    @for (pt of points; track pt.id) {
      <div class="point-item-col">
        <div class="point-meta-row">
          <span class="p-title">{{ pt.title }}</span>
          <span class="p-score" [style.color]="pt.color">{{ pt.score }}%</span>
        </div>

        <div class="point-track">
          <div class="point-fill" [style.background]="pt.color" [style.width.%]="pt.score"></div>
        </div>
      </div>
    }
  </div>

  <!-- Action Link Footer -->
  <div class="card-footer-link">
    <a href="#" (click)="$event.preventDefault()" class="btn-analytics-link">
      <span>فتح تقارير التحليل المتقدمة ←</span>
    </a>
  </div>
</div>
