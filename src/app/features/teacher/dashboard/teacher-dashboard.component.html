<div class="teacher-dashboard-page animate-fade-in">
  <!-- Top Welcome Header Bar -->
  <draya-teacher-welcome-header
    (reviewAiClick)="handleReviewAiReports()"
    (notificationsClick)="handleNotificationClick()" />

  <!-- Optional AI Action Banner -->
  @if (aiAlert()) {
    <draya-teacher-ai-reports-banner
      [aiAlert]="aiAlert()!"
      (reviewClick)="handleReviewAiReports()"></draya-teacher-ai-reports-banner>
  }

  <!-- 4 KPI Stat Cards Grid -->
  <draya-teacher-kpi-grid [stats]="kpiStats()" />

  <!-- Row 1: Submissions Chart + Quick Actions & Alerts -->
  <section class="dashboard-row-grid grid-row-primary">
    <!-- Submissions Chart Component -->
    <draya-teacher-submissions-chart
      [chartMeta]="chartMeta()"
      [timeRange]="timeRange()"
      (rangeChange)="handleTimeRangeChange($event)" />

    <!-- Quick Actions & Attention Alerts Column -->
    <div class="dashboard-side-col">
      <draya-teacher-quick-actions
        (createAiExamClick)="handleCreateAiExam()"
        (newLectureClick)="handleNewLecture()"
        (followupStudentsClick)="handleFollowupStudents()"
        (openReportsClick)="handleOpenReports()" />

      <draya-teacher-attention-alerts [alerts]="urgentAlerts()" />
    </div>
  </section>

  <!-- Row 2: Tables -->
  <section class="dashboard-row-grid grid-row-tables">
    <draya-teacher-followup-table [students]="studentsNeedingFollowup()" />

    <draya-teacher-recent-submissions-table [submissions]="recentSubmissions()" />
  </section>
</div>
